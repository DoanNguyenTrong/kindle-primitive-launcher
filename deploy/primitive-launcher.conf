# Primitive Launcher: the boot job (opt-in). Installed by deploy/install-autostart.sh to /etc/upstart/primitive-launcher.conf.
# It runs once per boot. It starts the SSH server, then the boot guard, from /mnt/us when the user storage is mounted and
# from the copy on /var/local when it is not (the Kindle unmounts /mnt/us while it shows its drive to a computer, so a
# cable in at boot would otherwise leave the launcher out). Escape hatches: /mnt/us/launcher/DISABLE and
# /mnt/us/BOOT_KINDLE (the guard reads them when /mnt/us is there).

description "Primitive Launcher boot guard"
author "Primitive AI"

start on started lab126_gui

task

script
    M=/var/local/primitive-launcher
    # The SSH server, once per boot (a second start of the framework must not bring it back after it was turned off).
    if [ -f $M/ssh.sh ] && [ ! -e /var/tmp/kl-ssh-boot ]; then
        : > /var/tmp/kl-ssh-boot
        sh $M/ssh.sh start >/dev/null 2>&1 || true
    fi
    if [ -f /mnt/us/launcher/boot.sh ]; then
        D=/mnt/us/launcher
    else
        D=$M
    fi
    [ -f $D/boot.sh ] || exit 0
    export KL_DIR=$D
    nohup sh $D/boot.sh > /dev/null 2>&1 &
    exit 0
end script

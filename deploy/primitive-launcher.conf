# Primitive Launcher: start the launcher after a normal boot (Phase 3, opt-in).
# Installed by deploy/install-autostart.sh to /etc/upstart/primitive-launcher.conf (root filesystem).
# Runs once per boot: the guard (/mnt/us/launcher/boot.sh) keeps its own once-per-boot marker, because
# Kindle mode restarts the framework and that emits "started lab126_gui" again.
# Escape hatches, editable over USB: /mnt/us/launcher/DISABLE and /mnt/us/BOOT_KINDLE.
# The start event is provisional until S6 confirms it on the device.

description "Primitive Launcher boot guard"
author "Primitive AI"

start on started lab126_gui

task

script
    # Wait for the user's storage (/mnt/us) to be mounted, up to 60 s.
    i=0
    while [ ! -f /mnt/us/launcher/boot.sh ] && [ $i -lt 60 ]; do
        sleep 1
        i=$((i + 1))
    done
    [ -f /mnt/us/launcher/boot.sh ] || exit 0
    [ -e /mnt/us/launcher/DISABLE ] && exit 0
    [ -e /mnt/us/BOOT_KINDLE ] && exit 0
    nohup sh /mnt/us/launcher/boot.sh > /dev/null 2>&1 &
    exit 0
end script

name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    # Pin the shared workflow to @v1 once that release is approved and exists.
    uses: DoanNguyenTrong/kindle-primitive-build/.github/workflows/package.yml@main
    permissions:
      contents: write
    with:
      id: primitive-launcher
      dir: launcher
      binary-crate: kl-launcher
      arches: armhf
      firmware-min: "5.16.3"
      install-file: docs/INSTALL.md
      changelog-file: docs/CHANGELOG.md
      docs-licence-file: LICENSE-DOCS
      legacy-usb: true
